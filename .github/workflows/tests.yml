name: Pruebas

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Ejecutar suite determinista
        run: sh .agents/tests/run-tests.sh
      - name: Ejecutar suite del gestor de tareas
        run: sh .agents/tests/run-task-tests.sh

  landing:
    name: Validar la landing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verificar JavaScript
        run: node --check site/app.js
      - name: Ejecutar pruebas del sitio
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Validar la construcción pública
        run: python3 scripts/build-site.py

  browser:
    name: Landing en escritorio y móvil (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tests/browser
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Preparar Node para las pruebas del navegador
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Instalar dependencias de pruebas fijadas
        run: npm ci
      - name: Instalar Chromium para las pruebas
        run: npx playwright install --with-deps chromium
      - name: Comprobar estados y portapapeles en ambos tamaños
        env:
          PYTHON: python3
        run: npm test
      - name: Conservar el informe y las trazas si falla el navegador
        if: failure()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: diagnostico-playwright
          path: |
            tests/browser/playwright-report/
            tests/browser/test-results/
          retention-days: 7
