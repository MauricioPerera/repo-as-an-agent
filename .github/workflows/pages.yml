name: Publicar landing

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'prompt.md'
      - 'scripts/build-site.py'
      - 'tests/test_site.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  refresh-release:
    name: Solicitar la actualización de la cabecera desde la rama predeterminada
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
    steps:
      - name: Lanzar Pages desde la rama permitida
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        # A release runs on a tag, but Pages environments commonly allow only main.
        # workflow_dispatch can start another run even when using GITHUB_TOKEN.
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref "$DEFAULT_BRANCH"

  build:
    name: Validar y construir la landing
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verificar JavaScript
        run: node --check site/app.js
      - name: Verificar enlaces y límites de publicación
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Construir solo los archivos públicos
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/build-site.py --fetch-release
      - name: Preparar el artefacto de Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: _site

  deploy:
    name: Publicar en GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
